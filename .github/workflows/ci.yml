name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: swift test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  perf-gate:
    name: PerfHarness 10 MB gate
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Open + keystroke + find (10 MB short-line)
        run: Scripts/perf-ci-gate.sh 10mb
