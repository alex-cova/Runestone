name: Nightly PerfHarness

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  nightly-perf:
    name: 100 MB / 500 MB short-line
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 100 MB (report only)
        run: Scripts/perf-ci-gate.sh 100mb
      - name: 500 MB (report only)
        run: Scripts/perf-ci-gate.sh 500mb
